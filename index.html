<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c8202b" />
    <title>Caffè Quotidiano</title>
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="src/assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <!-- On a real phone this is a no-op wrapper — the frame/notch/mat only
         render past the desktop breakpoint in style.css. #app itself stays
         the single element main.js ever touches. -->
    <div id="phone-mat">
      <div id="phone-frame">
        <div id="phone-notch"></div>
        <main id="app"></main>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
